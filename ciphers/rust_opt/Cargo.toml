[package]
name = "lwc_rust_opt"
version = "0.2.0"
edition = "2021"
description = "no_std hardware-optimized lightweight-cipher implementations behind a C ABI"
license = "MIT"
publish = false

[lib]
name = "lwc_rust_opt"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# None. core only.

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false
incremental = false
debug = false

[profile.speed]
inherits = "release"

[profile.size]
inherits = "release"
opt-level = "z"

[profile.dev]
panic = "abort"
